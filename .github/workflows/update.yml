name: Update jobs and publish
on:
  schedule:
    - cron: '23 0 * * *'
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/collect.py', 'scripts/enterprise.py', 'scripts/build.py', 'tests/**', 'config/**', 'requirements.txt', '.github/workflows/update.yml']
concurrency:
  group: jobs-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Check parsers and filters offline
        run: |
          python -m unittest discover -s tests -v
          node --test tests/logic.test.mjs
      - name: Collect public sources in cloud
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Save data and source health
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name 'jobs-bot'
          git config user.email 'jobs-bot@users.noreply.github.com'
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "data: daily recruiting update [skip actions]"
            git pull --rebase origin main
            git push
          fi
      - name: Build static website
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report unavailable collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'All sources failed. Previous data and diagnostics were preserved and published.'
          exit 1
