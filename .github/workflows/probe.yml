name: Inspect cloud sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.4 requests==2.32.4
      - run: python scripts/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshots
          path: snapshots
