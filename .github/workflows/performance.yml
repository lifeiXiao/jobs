name: Measure mobile loading
on:
  workflow_dispatch:
    inputs:
      label:
        description: Measurement label
        default: baseline
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node scripts/performance.mjs
        env:
          MEASURE_LABEL: ${{ inputs.label }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-performance-${{ inputs.label }}
          path: performance
